name: ERK CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary development platform; Linux is the second
        # target. macOS joins in M2, when the window layer needs checking there.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # With no argument, rustup installs the toolchain named in
      # rust-toolchain.toml, so CI and local builds use the same compiler.
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose

  # Architecture guards. Each one arrives in the same pull request as the thing
  # it protects; see docs/design/p0-verification.md for the schedule and the
  # deliberate violation each was tested with.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      # unsafe_code = "forbid" lives in [workspace.lints]; a crate that drops
      # `[lints] workspace = true` silently opts out of it.
      - name: Every crate inherits the workspace lints
        run: |
          fail=0
          for f in crates/*/Cargo.toml; do
            if ! grep -Pzq '\[lints\]\s*\nworkspace = true' "$f"; then
              echo "$f does not inherit [workspace.lints]"
              fail=1
            fi
          done
          exit $fail

      # The DOM is the bottom layer: everything above may depend on it, it
      # depends on no other workspace crate.
      - name: erk-dom depends on no other workspace crate
        run: |
          if cargo tree -p erk-dom -e normal --prefix none | grep -E '^erk-' | grep -v '^erk-dom '; then
            echo "erk-dom must stay a leaf crate"
            exit 1
          fi

      # clippy's disallowed_types can be silenced with an allow attribute,
      # which would quietly bring reference-counted nodes back.
      - name: The Rc ban in erk-dom is not silenced
        run: |
          if grep -rn 'disallowed_types' crates/erk-dom/src crates/erk-dom/tests; then
            echo "do not allow clippy::disallowed_types in erk-dom"
            exit 1
          fi
